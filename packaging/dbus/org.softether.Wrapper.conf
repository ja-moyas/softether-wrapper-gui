<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The helper owns the name; it runs as root under systemd. -->
  <policy user="root">
    <allow own="org.softether.Wrapper"/>
    <allow send_destination="org.softether.Wrapper"/>
  </policy>

  <!-- Unprivileged clients may call the helper; polkit authorises every
       method that mutates state. -->
  <policy context="default">
    <allow send_destination="org.softether.Wrapper"/>
    <allow receive_sender="org.softether.Wrapper"/>
  </policy>
</busconfig>
