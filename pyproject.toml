[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "softether-wrapper"
version = "0.1.0"
description = "Graphical system-tray wrapper for the SoftEther vpncmd client on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SoftEther VPN Wrapper contributors" }]
dependencies = [
    "PySide6-Essentials>=6.5",
    "dbus-next>=0.2.3",
    "qasync>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
softether-wrapper = "softether_wrapper.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "helper"]
include = ["softether_wrapper*", "softether_wrapper_helper*"]

[tool.setuptools.package-data]
softether_wrapper = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "helper"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "helper", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src:helper"
packages = ["softether_wrapper", "softether_wrapper_helper"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["PySide6.*", "qasync", "qasync.*"]
ignore_missing_imports = true

# dbus-next builds proxy methods dynamically, so the ``call_*`` accessors are
# invisible to the type checker.
[[tool.mypy.overrides]]
module = ["softether_wrapper_helper.polkit", "softether_wrapper.dbus_client"]
disable_error_code = ["attr-defined", "assignment"]

# dbus-next reads the D-Bus signatures from string annotations like "a{sv}".
[[tool.mypy.overrides]]
module = ["softether_wrapper_helper.service"]
disable_error_code = ["name-defined", "valid-type", "misc"]
